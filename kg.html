
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KG - School Learning App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #222;
        }

        header {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .welcome h2 {
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .subjects {
            margin-top: 25px;
            display: grid;
            gap: 15px;
        }

        .subject {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
            color: #0d47a1;
        }

        .back {
            display: block;
            margin-top: 25px;
            padding: 14px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 10px;
        }

        footer {
            margin-top: 30px;
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>KG Class</h1>
    <p>Government Boys Primary School</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome KG Students</h2>
        <p>
            Learn, play and grow with our school learning app.
        </p>
    </div>

    <div class="subjects">

        <div class="subject">
            📚 English
        </div>

        <div class="subject">
            🔢 Mathematics
        </div>

        <div class="subject">
            🌍 General Knowledge
        </div>

        <div class="subject">
            ✏️ Activities
        </div>

    </div>

    <a href="index.html" class="back">
        ← Back to Classes
    </a>

</div>

<footer>
    © 2026 Government Boys Primary School
</footer>

</body>
</html>
