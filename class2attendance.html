<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class 2 Attendance | GBPS Karam Khan Nizamani</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #222;
        }

        header {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            margin-top: 8px;
        }

        .content {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px;
        }

        .title {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 20px;
        }

        .box {
            background: white;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .add {
            background: #0d47a1;
            color: white;
            width: 100%;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            text-align: center;
            padding: 15px 5px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .stat h3 {
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat p {
            font-size: 22px;
            font-weight: bold;
            color: #0d47a1;
        }

        .student {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .student-name {
            color: #0d47a1;
            font-size: 18px;
            font-weight: bold;
        }

        .gr {
            color: #666;
            margin: 5px 0 12px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .present {
            background: #2e7d32;
            color: white;
        }

        .absent {
            background: #c62828;
            color: white;
        }

        .leave {
            background: #f9a825;
            color: white;
        }

        .edit {
            background: #1565c0;
            color: white;
        }

        .delete {
            background: #555;
            color: white;
        }

        .selected {
            outline: 3px solid #222;
        }

        .empty {
            background: white;
            padding: 25px;
            text-align: center;
            color: #777;
            border-radius: 10px;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 25px auto;
            padding: 12px 25px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .actions button {
                flex: 1 1 45%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Government Boys Primary School</h1>
    <p>Karam Khan Nizamani Campus</p>
</header>

<section class="content">

    <h2 class="title">👨‍🎓 Class 2 Student Record & Attendance</h2>

    <div class="box">

        <label for="attendanceDate">
            📅 Attendance Date
        </label>

        <input type="date" id="attendanceDate">

    </div>

    <div class="box">

        <label for="studentName">
            Student Name
        </label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >

        <label for="grNo">
            GR No.
        </label>

        <input
            type="text"
            id="grNo"
            placeholder="Enter GR number"
        >

        <button class="add" onclick="addStudent()">
            ➕ Add Student
        </button>

    </div>

    <div class="stats">

        <div class="stat">
            <h3>Total Students</h3>
            <p id="total">0</p>
        </div>

        <div class="stat">
            <h3>Present</h3>
            <p id="present">0</p>
        </div>

        <div class="stat">
            <h3>Absent</h3>
            <p id="absent">0</p>
        </div>

        <div class="stat">
            <h3>Leave</h3>
            <p id="leave">0</p>
        </div>

    </div>

    <div id="studentList"></div>

    <a href="class2.html" class="back">
        ← Back to Class 2
    </a>

</section>

<footer>
    © 2026 Government Boys Primary School
</footer>

<script>

let students =
    JSON.parse(localStorage.getItem("class2Students")) || [];

const today = new Date().toISOString().split("T")[0];

document.getElementById("attendanceDate").value = today;


function saveStudents() {

    localStorage.setItem(
        "class2Students",
        JSON.stringify(students)
    );

}


function addStudent() {

    const name =
        document.getElementById("studentName").value.trim();

    const grNo =
        document.getElementById("grNo").value.trim();

    if (name === "" || grNo === "") {

        alert("Please enter Student Name and GR No.");

        return;
    }

    const student = {

        id: Date.now(),

        name: name,

        grNo: grNo,

        attendance: "present"

    };

    students.push(student);

    saveStudents();

    document.getElementById("studentName").value = "";

    document.getElementById("grNo").value = "";

    displayStudents();

}


function setAttendance(id, status) {

    const student =
        students.find(s => s.id === id);

    if (student) {

        student.attendance = status;

        saveStudents();

        displayStudents();

    }

}


function editStudent(id) {

    const student =
        students.find(s => s.id === id);

    if (!student) return;

    const name =
        prompt("Edit Student Name:", student.name);

    if (name === null || name.trim() === "") {
        return;
    }

    const grNo =
        prompt("Edit GR No.:", student.grNo);

    if (grNo === null || grNo.trim() === "") {
        return;
    }

    student.name = name.trim();

    student.grNo = grNo.trim();

    saveStudents();

    displayStudents();

}


function deleteStudent(id) {

    const student =
        students.find(s => s.id === id);

    if (!student) return;

    if (
        confirm(
            "Are you sure you want to delete " +
            student.name +
            "?"
        )
    ) {

        students =
            students.filter(s => s.id !== id);

        saveStudents();

        displayStudents();

    }

}


function displayStudents() {

    const list =
        document.getElementById("studentList");

    if (students.length === 0) {

        list.innerHTML = `
            <div class="empty">
                No students added yet.
            </div>
        `;

        updateStats();

        return;
    }

    list.innerHTML = "";

    students.forEach(student => {

        const div =
            document.createElement("div");

        div.className = "student";

        div.innerHTML = `

            <div class="student-name">
                ${student.name}
            </div>

            <div class="gr">
                GR No.: ${student.grNo}
            </div>

            <div class="actions">

                <button
                    class="present ${
                        student.attendance === "present"
                        ? "selected"
                        : ""
                    }"
                    onclick="setAttendance(
                        ${student.id},
                        'present'
                    )">
                    ✅ Present
                </button>

                <button
                    class="absent ${
                        student.attendance === "absent"
                        ? "selected"
                        : ""
                    }"
                    onclick="setAttendance(
                        ${student.id},
                        'absent'
                    )">
                    ❌ Absent
                </button>

                <button
                    class="leave ${
                        student.attendance === "leave"
                        ? "selected"
                        : ""
                    }"
                    onclick="setAttendance(
                        ${student.id},
                        'leave'
                    )">
                    🟡 Leave
                </button>

                <button
                    class="edit"
                    onclick="editStudent(
                        ${student.id}
                    )">
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteStudent(
                        ${student.id}
                    )">
                    🗑️ Delete
                </button>

            </div>
        `;

        list.appendChild(div);

    });

    updateStats();

}


function updateStats() {

    const total =
        students.length;

    const present =
        students.filter(
            s => s.attendance === "present"
        ).length;

    const absent =
        students.filter(
            s => s.attendance === "absent"
        ).length;

    const leave =
        students.filter(
            s => s.attendance === "leave"
        ).length;

    document.getElementById("total").textContent =
        total;

    document.getElementById("present").textContent =
        present;

    document.getElementById("absent").textContent =
        absent;

    document.getElementById("leave").textContent =
        leave;

}


displayStudents();

</script>

</body>
</html>
