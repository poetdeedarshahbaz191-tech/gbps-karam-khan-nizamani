
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GBPS Karam Khan Nizamani</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #222;
        }

        header {
            background: #0d47a1;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            margin-top: 8px;
            font-size: 15px;
        }

        .hero {
            text-align: center;
            padding: 45px 20px;
            background: white;
        }

        .hero h2 {
            color: #0d47a1;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 17px;
            line-height: 1.6;
        }

        .classes {
            padding: 30px 20px;
        }

        .classes h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 700px;
            margin: auto;
        }

        .class-card {
            background: white;
            padding: 25px 10px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
            color: #0d47a1;
            text-decoration: none;
display: block;
        }

        .class-card:hover {
            transform: translateY(-3px);
        }

        footer {
            margin-top: 30px;
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>Government Boys Primary School</h1>
    <p>Karam Khan Nizamani Campus</p>
</header>

<section class="hero">
    <h2>Welcome to Our School App</h2>

    <p>
        A simple digital learning platform for our students
        from KG to Class 5.
    </p>
</section>

<section class="classes">

    <h2>Our Classes</h2>

    <div class="class-grid">                                        
        <a href="kg.html" class="class-card">
    KG
</a>

        <div class="class-card">
            Class 1
        </div>

        <div class="class-card">
            Class 2
        </div>

        <div class="class-card">
            Class 3
        </div>

        <div class="class-card">
            Class 4
        </div>

        <div class="class-card">
            Class 5
        </div>

    </div>

</section>

<footer>
    © 2026 Government Boys Primary School
</footer>

</body>
</html>
