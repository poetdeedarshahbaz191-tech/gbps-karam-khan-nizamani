<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | GBPS Karam Khan Nizamani</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f6f9;
            color: #222;
        }

        header {
            background: #006a4e;
            color: white;
            padding: 18px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 15px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #006a4e;
            text-decoration: none;
            font-weight: bold;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .box h2 {
            color: #006a4e;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .add-btn {
            margin-top: 15px;
            background: #006a4e;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #004d39;
        }

        .cancel-btn {
            margin-top: 15px;
            margin-left: 8px;
            background: #777;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            display: none;
        }

        .cancel-btn:hover {
            background: #555;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1150px;
        }

        th {
            background: #006a4e;
            color: white;
            padding: 11px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .edit-btn {
            background: #1565c0;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn:hover {
            background: #0d47a1;
        }

        .delete-btn {
            background: #c62828;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #8e0000;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #006a4e;
            color: white;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 19px;
            }

            .box {
                padding: 15px;
            }

            .cancel-btn {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏫 GBPS Karam Khan Nizamani</h1>
    <p>Student Management</p>
</header>

<div class="container">

    <a href="admin-dashboard.html" class="back">
        ← Back to Admin Dashboard
    </a>


    <!-- ADD / EDIT STUDENT -->
    <div class="box">

        <h2 id="formTitle">➕ Add New Student</h2>

        <div class="form-grid">

            <!-- GR NUMBER -->
            <input
                type="text"
                id="grNumber"
                placeholder="GR No."
            >

            <!-- STUDENT NAME -->
            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
            >

            <!-- FATHER NAME -->
            <input
                type="text"
                id="fatherName"
                placeholder="Father's Name"
            >

            <!-- DATE OF BIRTH -->
            <input
                type="date"
                id="dateOfBirth"
                title="Date of Birth"
            >

            <!-- B-FORM -->
            <input
                type="text"
                id="bForm"
                placeholder="B-Form"
            >

            <!-- CLASS -->
            <select id="studentClass">

                <option value="">Select Class</option>

                <option value="KG">KG</option>

                <option value="Class 1">Class 1</option>

                <option value="Class 2">Class 2</option>

                <option value="Class 3">Class 3</option>

                <option value="Class 4">Class 4</option>

                <option value="Class 5">Class 5</option>

            </select>

            <!-- ROLL NUMBER -->
            <input
                type="text"
                id="rollNumber"
                placeholder="Roll Number"
            >

        </div>


        <button
            class="add-btn"
            id="saveButton"
            onclick="saveStudent()"
        >
            ➕ Add Student
        </button>


        <button
            class="cancel-btn"
            id="cancelButton"
            onclick="cancelEdit()"
        >
            Cancel
        </button>

    </div>


    <!-- STUDENT RECORDS -->
    <div class="box">

        <h2>👨‍🎓 Student Records</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Serial No.</th>
                        <th>GR No.</th>
                        <th>Student Name</th>
                        <th>Father's Name</th>
                        <th>Date of Birth</th>
                        <th>B-Form</th>
                        <th>Class</th>
                        <th>Roll No.</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTable">
                </tbody>

            </table>

        </div>


        <div id="emptyMessage" class="empty">
            No students added yet.
        </div>

    </div>

</div>


<footer>
    © 2026 GBPS Karam Khan Nizamani Campus
</footer>


<script>

    // LOAD STUDENTS
    let students =
        JSON.parse(localStorage.getItem("students")) || [];


    // CURRENT EDITING STUDENT
    let editingIndex = -1;


    // SAVE NEW STUDENT OR UPDATE STUDENT
    function saveStudent() {

        const grNumber =
            document.getElementById("grNumber").value.trim();

        const name =
            document.getElementById("studentName").value.trim();

        const father =
            document.getElementById("fatherName").value.trim();

        const dateOfBirth =
            document.getElementById("dateOfBirth").value;

        const bForm =
            document.getElementById("bForm").value.trim();

        const studentClass =
            document.getElementById("studentClass").value;

        const roll =
            document.getElementById("rollNumber").value.trim();


        // CHECK FIELDS
        if (
            grNumber === "" ||
            name === "" ||
            father === "" ||
            dateOfBirth === "" ||
            bForm === "" ||
            studentClass === "" ||
            roll === ""
        ) {

            alert("Please fill in all fields.");

            return;
        }


        // CREATE STUDENT OBJECT
        const student = {

            grNumber: grNumber,

            name: name,

            father: father,

            dateOfBirth: dateOfBirth,

            bForm: bForm,

            className: studentClass,

            roll: roll

        };


        // UPDATE EXISTING STUDENT
        if (editingIndex !== -1) {

            students[editingIndex] = student;

            alert("Student information updated successfully.");

        }

        // ADD NEW STUDENT
        else {

            students.push(student);

            alert("Student added successfully.");

        }


        // SAVE TO LOCAL STORAGE
        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


        // RESET FORM
        clearForm();


        // REFRESH TABLE
        displayStudents();

    }


    // EDIT STUDENT
    function editStudent(index) {

        const student = students[index];


        // LOAD STUDENT DATA INTO FORM
        document.getElementById("grNumber").value =
            student.grNumber || "";

        document.getElementById("studentName").value =
            student.name || "";

        document.getElementById("fatherName").value =
            student.father || "";

        document.getElementById("dateOfBirth").value =
            student.dateOfBirth || "";

        document.getElementById("bForm").value =
            student.bForm || "";

        document.getElementById("studentClass").value =
            student.className || "";

        document.getElementById("rollNumber").value =
            student.roll || "";


        // REMEMBER WHICH STUDENT IS BEING EDITED
        editingIndex = index;


        // CHANGE FORM TITLE
        document.getElementById("formTitle").innerHTML =
            "✏️ Edit Student";


        // CHANGE BUTTON
        document.getElementById("saveButton").innerHTML =
            "💾 Update Student";


        // SHOW CANCEL BUTTON
        document.getElementById("cancelButton").style.display =
            "inline-block";


        // SCROLL TO FORM
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // CANCEL EDIT
    function cancelEdit() {

        editingIndex = -1;

        clearForm();

    }


    // CLEAR FORM
    function clearForm() {

        document.getElementById("grNumber").value = "";

        document.getElementById("studentName").value = "";

        document.getElementById("fatherName").value = "";

        document.getElementById("dateOfBirth").value = "";

        document.getElementById("bForm").value = "";

        document.getElementById("studentClass").value = "";

        document.getElementById("rollNumber").value = "";


        // RESET TITLE
        document.getElementById("formTitle").innerHTML =
            "➕ Add New Student";


        // RESET BUTTON
        document.getElementById("saveButton").innerHTML =
            "➕ Add Student";


        // HIDE CANCEL
        document.getElementById("cancelButton").style.display =
            "none";


        // RESET EDITING INDEX
        editingIndex = -1;

    }


    // DISPLAY STUDENTS
    function displayStudents() {

        const table =
            document.getElementById("studentTable");

        const emptyMessage =
            document.getElementById("emptyMessage");


        table.innerHTML = "";


        // NO STUDENTS
        if (students.length === 0) {

            emptyMessage.style.display = "block";

            return;
        }


        emptyMessage.style.display = "none";


        // DISPLAY EVERY STUDENT
        students.forEach(function(student, index) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${index + 1}</td>

                <td>${student.grNumber || ""}</td>

                <td>${student.name || ""}</td>

                <td>${student.father || ""}</td>

                <td>${student.dateOfBirth || ""}</td>

                <td>${student.bForm || ""}</td>

                <td>${student.className || ""}</td>

                <td>${student.roll || ""}</td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editStudent(${index})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${index})"
                    >
                        🗑️ Delete
                    </button>

                </td>

            `;


            table.appendChild(row);

        });

    }


    // DELETE STUDENT
    function deleteStudent(index) {

        if (
            confirm(
                "Are you sure you want to delete this student?"
            )
        ) {

            students.splice(index, 1);


            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );


            displayStudents();

        }

    }


    // LOAD RECORDS WHEN PAGE OPENS
    displayStudents();

</script>

</body>
</html>
