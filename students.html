
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | GBPS Karam Khan Nizamani</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f6f9;
            color: #222;
        }

        header {
            background: #006a4e;
            color: white;
            padding: 18px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 15px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #006a4e;
            text-decoration: none;
            font-weight: bold;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .box h2 {
            color: #006a4e;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .add-btn {
            margin-top: 15px;
            background: #006a4e;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #004d39;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #006a4e;
            color: white;
            padding: 11px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .delete-btn {
            background: #c62828;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #006a4e;
            color: white;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 19px;
            }

            .box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏫 GBPS Karam Khan Nizamani</h1>
    <p>Student Management</p>
</header>

<div class="container">

    <a href="admin-dashboard.html" class="back">← Back to Admin Dashboard</a>

    <div class="box">
        <h2>➕ Add New Student</h2>

        <div class="form-grid">

            <input type="text" id="studentName" placeholder="Student Name">

            <input type="text" id="fatherName" placeholder="Father's Name">

            <select id="studentClass">
                <option value="">Select Class</option>
                <option value="KG">KG</option>
                <option value="Class 1">Class 1</option>
                <option value="Class 2">Class 2</option>
                <option value="Class 3">Class 3</option>
                <option value="Class 4">Class 4</option>
                <option value="Class 5">Class 5</option>
            </select>

            <input type="text" id="rollNumber" placeholder="Roll Number">

        </div>

        <button class="add-btn" onclick="addStudent()">
            ➕ Add Student
        </button>
    </div>

    <div class="box">

        <h2>👨‍🎓 Student Records</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Father's Name</th>
                        <th>Class</th>
                        <th>Roll No.</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>
            </table>

        </div>

        <div id="emptyMessage" class="empty">
            No students added yet.
        </div>

    </div>

</div>

<footer>
    © 2026 GBPS Karam Khan Nizamani Campus
</footer>

<script>

    let students = JSON.parse(localStorage.getItem("students")) || [];

    function addStudent() {

        const name = document.getElementById("studentName").value.trim();
        const father = document.getElementById("fatherName").value.trim();
        const studentClass = document.getElementById("studentClass").value;
        const roll = document.getElementById("rollNumber").value.trim();

        if (name === "" || father === "" || studentClass === "" || roll === "") {
            alert("Please fill in all fields.");
            return;
        }

        const student = {
            name: name,
            father: father,
            className: studentClass,
            roll: roll
        };

        students.push(student);

        localStorage.setItem("students", JSON.stringify(students));

        document.getElementById("studentName").value = "";
        document.getElementById("fatherName").value = "";
        document.getElementById("studentClass").value = "";
        document.getElementById("rollNumber").value = "";

        displayStudents();
    }

    function displayStudents() {

        const table = document.getElementById("studentTable");
        const emptyMessage = document.getElementById("emptyMessage");

        table.innerHTML = "";

        if (students.length === 0) {
            emptyMessage.style.display = "block";
            return;
        }

        emptyMessage.style.display = "none";

        students.forEach(function(student, index) {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${student.name}</td>
                <td>${student.father}</td>
                <td>${student.className}</td>
                <td>${student.roll}</td>
                <td>
                    <button class="delete-btn" onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });
    }

    function deleteStudent(index) {

        if (confirm("Are you sure you want to delete this student?")) {

            students.splice(index, 1);

            localStorage.setItem("students", JSON.stringify(students));

            displayStudents();
        }
    }

    displayStudents();

</script>

</body>
</html>
